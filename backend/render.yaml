services:
  - type: web
    name: karigaar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/download_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
